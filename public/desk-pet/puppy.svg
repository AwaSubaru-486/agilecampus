<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="128" height="128">
  <style>
    .outline { fill: #1e293b; }
    .white { fill: #ffffff; }
    .pink { fill: #fb7185; }
    .dark { fill: #0f172a; }
    .cream { fill: #f8fafc; }
  </style>
  <!-- 线条小狗 (Pixel Maltese) 32x32 像素艺术画风 -->
  <!-- 左耳 -->
  <rect x="5" y="8" width="4" height="7" class="outline"/>
  <rect x="6" y="9" width="3" height="6" class="white"/>
  <rect x="4" y="11" width="2" height="4" class="outline"/>
  <rect x="5" y="12" width="1" height="3" class="cream"/>

  <!-- 右耳 -->
  <rect x="23" y="8" width="4" height="7" class="outline"/>
  <rect x="23" y="9" width="3" height="6" class="white"/>
  <rect x="26" y="11" width="2" height="4" class="outline"/>
  <rect x="26" y="12" width="1" height="3" class="cream"/>

  <!-- 头部外轮廓 -->
  <rect x="9" y="6" width="14" height="2" class="outline"/>
  <rect x="8" y="8" width="16" height="2" class="outline"/>
  <rect x="7" y="10" width="18" height="8" class="outline"/>
  <rect x="8" y="18" width="16" height="2" class="outline"/>

  <!-- 头部白毛填充 -->
  <rect x="9" y="8" width="14" height="2" class="white"/>
  <rect x="8" y="10" width="16" height="8" class="white"/>
  <rect x="9" y="18" width="14" height="1" class="white"/>

  <!-- 大眼睛与高光 -->
  <rect x="11" y="12" width="2" height="3" class="dark"/>
  <rect x="11" y="12" width="1" height="1" class="white"/>
  <rect x="19" y="12" width="2" height="3" class="dark"/>
  <rect x="19" y="12" width="1" height="1" class="white"/>

  <!-- 粉嫩小腮红 -->
  <rect x="9" y="15" width="2" height="2" class="pink"/>
  <rect x="21" y="15" width="2" height="2" class="pink"/>

  <!-- 萌萌小鼻子与笑嘴 -->
  <rect x="15" y="14" width="2" height="2" class="dark"/>
  <rect x="14" y="17" width="4" height="1" class="dark"/>
  <rect x="15" y="16" width="2" height="1" class="dark"/>

  <!-- 身体与小短腿 -->
  <rect x="10" y="20" width="12" height="7" class="outline"/>
  <rect x="11" y="20" width="10" height="6" class="white"/>
  <rect x="10" y="26" width="3" height="3" class="outline"/>
  <rect x="11" y="26" width="2" height="2" class="white"/>
  <rect x="19" y="26" width="3" height="3" class="outline"/>
  <rect x="19" y="26" width="2" height="2" class="white"/>

  <!-- 翘起摇摆的小尾巴 -->
  <rect x="22" y="21" width="3" height="3" class="outline"/>
  <rect x="22" y="22" width="2" height="2" class="white"/>
  <rect x="24" y="19" width="2" height="3" class="outline"/>
  <rect x="24" y="20" width="1" height="2" class="white"/>
</svg>
