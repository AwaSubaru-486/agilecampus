<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="128" height="128">
  <style>
    .pacman { fill: #facc15; }
    .pac-shadow { fill: #ca8a04; }
    .pellet { fill: #fef08a; }
    .ghost-body { fill: #06b6d4; }
    .ghost-white { fill: #ffffff; }
    .ghost-eye { fill: #1e3a8a; }
    .cherry-red { fill: #ef4444; }
    .cherry-stem { fill: #15803d; }
  </style>
  <!-- 吃豆人 (Pixel Pac-Man & Ghost) 32x32 像素艺术画风 -->
  <!-- 吃豆人主体 (张嘴动画帧) -->
  <rect x="7" y="6" width="8" height="1" class="pacman"/>
  <rect x="5" y="7" width="12" height="1" class="pacman"/>
  <rect x="4" y="8" width="13" height="1" class="pacman"/>
  <rect x="3" y="9" width="12" height="1" class="pacman"/>
  <rect x="3" y="10" width="10" height="1" class="pacman"/>
  <rect x="2" y="11" width="9" height="1" class="pacman"/>
  <rect x="2" y="12" width="7" height="1" class="pacman"/>
  <rect x="2" y="13" width="5" height="1" class="pacman"/>
  <rect x="2" y="14" width="7" height="1" class="pacman"/>
  <rect x="2" y="15" width="9" height="1" class="pacman"/>
  <rect x="3" y="16" width="10" height="1" class="pacman"/>
  <rect x="3" y="17" width="12" height="1" class="pacman"/>
  <rect x="4" y="18" width="13" height="1" class="pacman"/>
  <rect x="5" y="19" width="12" height="1" class="pacman"/>
  <rect x="7" y="20" width="8" height="1" class="pacman"/>

  <!-- 底部微像素立体阴影 -->
  <rect x="5" y="20" width="2" height="1" class="pac-shadow"/>
  <rect x="15" y="20" width="2" height="1" class="pac-shadow"/>

  <!-- 能量发光豆豆 -->
  <rect x="19" y="12" width="3" height="3" class="pellet"/>
  <rect x="25" y="12" width="2" height="2" class="pellet"/>
  <rect x="29" y="12" width="2" height="2" class="pellet"/>

  <!-- 右上角点缀小樱桃 Bonus Cherry -->
  <rect x="23" y="3" width="2" height="1" class="cherry-stem"/>
  <rect x="25" y="4" width="1" height="2" class="cherry-stem"/>
  <rect x="22" y="5" width="3" height="3" class="cherry-red"/>
  <rect x="26" y="5" width="3" height="3" class="cherry-red"/>

  <!-- 萌宠迷你幽灵伴随在后 -->
  <rect x="2" y="23" width="7" height="1" class="ghost-body"/>
  <rect x="1" y="24" width="9" height="4" class="ghost-body"/>
  <!-- 幽灵裙摆波浪 -->
  <rect x="1" y="28" width="2" height="2" class="ghost-body"/>
  <rect x="4" y="28" width="3" height="2" class="ghost-body"/>
  <rect x="8" y="28" width="2" height="2" class="ghost-body"/>
  <!-- 幽灵大眼 -->
  <rect x="3" y="25" width="2" height="2" class="ghost-white"/>
  <rect x="4" y="25" width="1" height="1" class="ghost-eye"/>
  <rect x="6" y="25" width="2" height="2" class="ghost-white"/>
  <rect x="7" y="25" width="1" height="1" class="ghost-eye"/>
</svg>
